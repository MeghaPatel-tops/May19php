<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bootstrap Example</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
 
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
   <script src="script.js"></script>
</head>
<body>

<div class="container mt-3">
  <h2>Weather App form</h2>
  <form method="post">
    <div class="mb-3 mt-3">
      <label for="pwd">Countries:</label>
       <select class="form-select mt-3" id="country" onchange="getState(this.value)">
    
   </select>
   
    </div>
    <div class="mb-3 mt-3">
      <label for="pwd">States:</label>
       <select class="form-select mt-3" id="state" onchange="getCity(this.value)">
    
   </select>
   
    </div>
     <div class="mb-3 mt-3">
      <label for="pwd">States:</label>
       <select class="form-select mt-3" id="city" onchange="getApp(this.value)">
    
   </select>
   
    </div>
    
    <button type="submit" class="btn btn-primary">Submit</button>
  </form>
</div>
<div class="res" id="res"></div>

</body>
</html>
