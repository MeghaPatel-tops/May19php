<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: flex;
            justify-content: center;
        }
        .container{
            padding: 5px;
            width: 60%;
            border: 5px solid black;
            display: grid;
            grid: 'header header header header header header'
                  'aside aside content content content content'
                  'footer footer footer footer footer footer';
        }
        .aside{
            height: 400px;
            grid-area: aside;
            background-color: aquamarine;
        }
        .content{
            height: 400px;
            grid-area: content;
            background-color: orange;
        }
        .header{
            grid-area: header;
            background-color: aqua;
        }
         .footer{
            grid-area: footer;
            background-color: aqua;
        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Header</h1>
        </div>
       
         <div class="aside">
            <div class="nav-item"><a href="">Item-1</a></div>
            <div class="nav-item"><a href="">Item-2</a></div>
            <div class="nav-item"><a href="">Item-3</a></div>
            <div class="nav-item"><a href="">Item-4</a></div>
            <div class="nav-item"><a href="">Item-5</a></div>
        </div>
        <div class="content">
            <h1>Artical</h1>
            <h1>Section</h1>
        </div>
       
       <div class="footer" style="margin-top: 10px;">
            <h1>Footer</h1>
        </div>
    </div>
</body>
</html>
