<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .grid-container{
            width: 80%;
            border: 5px solid black;
            display: grid;
            gap:20px;
            grid-template-columns: auto auto auto auto;
        }
        .grid-item{
            height: auto;
            /* width: 100px; */
            background-color: green;
        }
        #gird-item3{
            grid-row: 1;
            grid-column: 3 / span 2;
        }
        #gird-item5{
            grid-row: 2 / span 3;
            grid-column: 2;
        }
    </style>
</head>
<body>
    <div class="grid-container">
        <div class="grid-item" id="gird-item1">Item-1</div>
        <div class="grid-item" id="gird-item2">Item-2</div>
        <div class="grid-item" id="gird-item3">Item-3</div>
        <div class="grid-item" id="gird-item4">Item-4</div>
        <div class="grid-item" id="gird-item5">Item-5</div>
        <div class="grid-item" id="gird-item6">Item-6</div>
        <div class="grid-item" id="gird-item7">Item-7</div>
        <div class="grid-item" id="gird-item8">Item-8</div>
        <div class="grid-item" id="gird-item9">Item-9</div>
        <div class="grid-item" id="gird-item10">Item-10</div>
    </div>
</body>
</html>
